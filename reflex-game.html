<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3秒仙人</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09060e;color:#fff;font-family:system-ui;text-align:center}.app{width:min(92vw,680px)}a{position:fixed;top:18px;left:18px;color:#bbb;text-decoration:none}.box{padding:45px 20px;border:2px solid #ffffff33;border-radius:28px;background:radial-gradient(circle,#5a1c64,#13101e 65%);box-shadow:0 0 55px #ff375f55}h1{margin:0;font-size:clamp(56px,15vw,100px);text-shadow:0 0 15px #ff375f}.time{font:800 clamp(52px,16vw,100px) ui-monospace;color:#5ac8fa;text-shadow:0 0 24px #5ac8fa;margin:24px}button{border:0;border-radius:15px;padding:16px 28px;background:linear-gradient(135deg,#ffd60a,#ff375f);font-weight:900;font-size:18px;cursor:pointer}.rank{font-size:clamp(50px,15vw,100px);font-weight:900}.flash{animation:f .25s}@keyframes f{50%{filter:brightness(5);transform:scale(1.02)}}</style></head><body><a href="index.html">← Kくんの部屋へ</a><main class="app"><div class="box" id="box"><h1>3秒仙人</h1><p id="msg">音とフラッシュが出たら、3.000秒を狙って押してﾈ。</p><div class="time" id="time">--.---</div><button id="btn">スタート！！</button><div class="rank" id="rank"></div><p id="detail"></p></div></main><script>let state='idle',start,timer,wait,ctx;const $=s=>document.querySelector(s),btn=$('#btn'),box=$('#box');function tone(){ctx??=new(window.AudioContext||webkitAudioContext);let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g).connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.2);o.stop(ctx.currentTime+.21)}function go(){state='go';start=performance.now();tone();box.classList.remove('flash');void box.offsetWidth;box.classList.add('flash');$('#msg').textContent='今だ！！！ 3秒を狙え！！';btn.textContent='ここだ！！';btn.disabled=false;function tick(n){if(state==='go'){$('#time').textContent=((n-start)/1000).toFixed(3);timer=requestAnimationFrame(tick)}}timer=requestAnimationFrame(tick)}function play(){state='wait';$('#rank').textContent='';$('#detail').textContent='';$('#time').textContent='--.---';$('#msg').textContent='集中…まだ押しちゃダメ！！';btn.textContent='待機中…';btn.disabled=true;wait=setTimeout(go,1200+Math.random()*2600)}btn.onclick=()=>{if(state==='idle'||state==='done')play();else if(state==='wait'){clearTimeout(wait);state='idle';btn.disabled=false;btn.textContent='早すぎ！！ もう一回';$('#msg').textContent='フライング！'}else{state='done';cancelAnimationFrame(timer);let s=(performance.now()-start)/1000,d=Math.abs(s-3);$('#time').textContent=s.toFixed(3);let r=d<=.05?'仙人':s<3?'凡人':'遅刻';$('#rank').textContent=r;$('#detail').textContent=r==='仙人'?`誤差 ${(d*1000).toFixed(0)}ms。時間を支配している。`:r==='凡人'?`あと ${(3-s).toFixed(3)}秒！修行しよう。`:`${(s-3).toFixed(3)}秒の遅刻です！！`;btn.textContent='もう一回！！';$('#msg').textContent='判定結果！'}};</script></body></html>
